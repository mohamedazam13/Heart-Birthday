<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>Open It My Heart</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Quicksand:wght@400;500;600;700&display=swap">
<style>
/* Layout: a fixed garden of falling red roses sits behind one centered column. A closed envelope opens, its photos rise out, then the page becomes a scroll of captioned photo cards while small heart-framed photos drift in the background. Single deliberate look: deep wine ground, rose reds, blush paper. */
:root{
  --bg:#17040a;
  --glow:#4d0b1a;
  --rose:#d1122f;
  --rose-deep:#7d0618;
  --blush:#ffe3e6;
  --paper:#fff1f2;
  --ink:#5b0a1a;
  --font-script:'Pinyon Script','Snell Roundhand','Apple Chancery',cursive;
  --font-body:'Quicksand',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100svh;
  background-color:var(--bg);
  background-image:radial-gradient(120% 80% at 50% 0%,var(--glow) 0%,transparent 62%);
  background-attachment:fixed;
  color:var(--blush);
  font:500 1rem/1.55 var(--font-body);
  padding-block:1.5rem 3rem;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow-x:clip;
}
#roses{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* drifting heart-framed photos */
.floaters{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity 1.8s ease}
body.opened .floaters{opacity:.92}
.floater{position:absolute;width:clamp(72px,19vw,132px);filter:drop-shadow(0 10px 18px rgba(0,0,0,.55))}
.floater svg{display:block;width:100%;height:auto;overflow:visible;transform-origin:50% 55%;animation:beat 1.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.09)}30%{transform:scale(1)}45%{transform:scale(1.06)}}
.f1{left:4%;top:12%;animation:drift1 17s ease-in-out infinite alternate}
.f2{right:5%;top:46%;width:clamp(64px,16vw,110px);animation:drift2 21s ease-in-out infinite alternate}
.f3{left:34%;bottom:5%;width:clamp(58px,14vw,96px);animation:drift3 24s ease-in-out infinite alternate}
@keyframes drift1{0%{transform:translate(0,0) rotate(-9deg) scale(1)}50%{transform:translate(34px,70px) rotate(6deg) scale(1.1)}100%{transform:translate(8px,150px) rotate(-4deg) scale(.95)}}
@keyframes drift2{0%{transform:translate(0,0) rotate(8deg) scale(1)}50%{transform:translate(-40px,-80px) rotate(-7deg) scale(.92)}100%{transform:translate(-12px,-150px) rotate(5deg) scale(1.08)}}
@keyframes drift3{0%{transform:translate(0,0) rotate(-5deg) scale(1)}50%{transform:translate(70px,-50px) rotate(9deg) scale(1.12)}100%{transform:translate(-50px,-110px) rotate(-8deg) scale(.96)}}
.ring{fill:none;stroke:var(--blush);stroke-width:3;stroke-linejoin:round}
.ph-fill{fill:url(#phGrad)}

/* envelope */
.intro{position:relative;z-index:2;min-height:calc(100svh - 4.5rem);display:grid;place-items:center;transition:opacity .7s ease,transform .7s ease}
.intro.leaving{opacity:0;transform:translateY(46px) scale(.96)}
.env-wrap{animation:bob 4.2s ease-in-out infinite alternate;filter:drop-shadow(0 26px 34px rgba(0,0,0,.6))}
.env-wrap.stop{animation:none}
@keyframes bob{to{transform:translateY(-10px)}}
.envelope{position:relative;display:block;width:min(86vw,380px);aspect-ratio:3/2;margin:0;padding:0;border:0;background:none;color:inherit;font:inherit;cursor:pointer;perspective:1100px;-webkit-tap-highlight-color:transparent}
.envelope:focus-visible{outline:3px solid var(--blush);outline-offset:12px;border-radius:8px}
.env-back{position:absolute;inset:0;z-index:0;border-radius:6px;background:linear-gradient(160deg,#8d0a1e,#5d0513)}
.env-front{position:absolute;inset:0;width:100%;height:100%;z-index:3;display:block}
.flap{position:absolute;left:0;top:0;width:100%;height:62%;z-index:5;transform-origin:50% 0;clip-path:polygon(0 0,100% 0,50% 100%);background:linear-gradient(180deg,#c9162f,#9d0c22);transition:transform .85s cubic-bezier(.5,0,.2,1),z-index 0s .35s}
.open .flap{transform:rotateX(180deg);z-index:1}
.mini{position:absolute;left:8%;right:8%;bottom:7%;height:80%;z-index:2;padding:6px;background:var(--paper);border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.35);transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.mini:nth-of-type(1){transform:rotate(-3deg)}
.mini:nth-of-type(2){transform:rotate(2deg)}
.mini:nth-of-type(3){transform:rotate(-1deg)}
.open .mini:nth-of-type(1){transform:translateY(-58%) rotate(-7deg) translateX(-8%);transition-delay:.5s}
.open .mini:nth-of-type(2){transform:translateY(-70%) rotate(6deg) translateX(8%);transition-delay:.65s}
.open .mini:nth-of-type(3){transform:translateY(-82%) rotate(-2deg);transition-delay:.8s}
.mini .ph{width:100%;height:100%}
.env-text{position:absolute;left:0;right:0;bottom:8%;z-index:4;text-align:center;font-family:var(--font-script);font-size:clamp(1.7rem,8.4vw,2.4rem);line-height:1;color:var(--blush);text-shadow:0 2px 6px rgba(60,0,10,.7);transition:opacity .4s ease}
.open .env-text{opacity:0}
.seal{position:absolute;left:50%;top:62%;width:18%;aspect-ratio:1;z-index:6;transform:translate(-50%,-50%);transition:transform .35s ease,opacity .35s ease}
.seal svg{display:block;width:100%;height:100%}
.open .seal{transform:translate(-50%,-50%) scale(.2);opacity:0}

/* photo placeholders and photos */
.ph{overflow:hidden;border-radius:3px;background:#3a0510}
.ph img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.ph.empty{display:grid;place-items:center;background:linear-gradient(160deg,var(--rose-deep),#3a0510)}
.ph.empty svg{width:30%;height:auto;fill:var(--rose);opacity:.6}

/* gallery */
#gallery{position:relative;z-index:2;max-width:480px;margin-inline:auto}
.hero{text-align:center;padding-block:1.5rem 2.5rem;text-shadow:0 2px 20px rgba(23,4,10,.85)}
.eyebrow{margin:0 0 .4rem;font-size:.8rem;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:#ff9aa8}
.hero h1{margin:0;font-family:var(--font-script);font-weight:400;line-height:1;text-wrap:balance}
.hb{display:block;font-size:clamp(2.2rem,9vw,3.2rem)}
.nm{display:block;font-size:clamp(5rem,28vw,8.5rem);color:var(--blush);text-shadow:0 0 28px rgba(209,18,47,.75),0 4px 22px rgba(23,4,10,.9)}
.lede{margin:.8rem auto 0;max-width:30ch;color:var(--blush);opacity:.9}
.cards{display:flex;flex-direction:column;align-items:center;gap:3.2rem;padding-block:.5rem 2rem}
.card{width:min(100%,420px);padding:14px 14px 22px;background:var(--paper);border-radius:6px;box-shadow:0 18px 40px rgba(0,0,0,.55);animation:rise .95s cubic-bezier(.2,.8,.2,1) both,sway 8s ease-in-out infinite alternate;animation-delay:calc(min(var(--i),3) * .35s),calc(var(--i) * -1.7s);transition:scale .25s ease}
.card:nth-child(odd){rotate:-1.2deg}
.card:nth-child(even){rotate:1.2deg}
.card .ph{aspect-ratio:4/5}
.card p{margin:16px 8px 0;text-align:center;font-family:var(--font-body);font-weight:700;font-size:clamp(1.1rem,4.6vw,1.3rem);line-height:1.45;letter-spacing:.01em;color:var(--ink);text-wrap:balance}
@keyframes rise{from{opacity:0;transform:translateY(70px) scale(.94)}to{opacity:1;transform:none}}
.end{text-align:center;padding-block:1rem 1rem;text-shadow:0 2px 16px rgba(23,4,10,.85)}
.end p{margin:0 0 1.2rem;font-family:var(--font-script);font-size:clamp(1.9rem,8vw,2.6rem);line-height:1.2}
.more{font:600 .95rem var(--font-body);letter-spacing:.04em;color:var(--blush);background:rgba(209,18,47,.35);border:1.5px solid var(--blush);border-radius:999px;padding:.75rem 1.6rem;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .2s ease,transform .2s ease}
.more:hover{background:rgba(209,18,47,.65)}
.more:active{transform:scale(.97)}
.more:focus-visible{outline:3px solid var(--blush);outline-offset:4px}

/* photo motion: only cards on screen get the .live class */
.card .ph{position:relative}
.card .ph img{transform-origin:var(--ox,50%) var(--oy,40%)}
.card.live .ph img{animation:kb 16s ease-in-out infinite alternate;animation-delay:calc(var(--i) * -2.3s)}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.12) translate(var(--tx,-2%),var(--ty,-2%))}}
.card .ph::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.32) 50%,transparent 62%);transform:translateX(-130%)}
.card.live .ph::after{animation:shine 6s ease-in-out infinite;animation-delay:calc(var(--i) * .7s)}
@keyframes shine{0%,55%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
@keyframes sway{from{rotate:calc(var(--s,1) * -1.5deg);translate:0 0}to{rotate:calc(var(--s,1) * 1.5deg);translate:0 -9px}}
.card{cursor:pointer;-webkit-tap-highlight-color:transparent}
.card.tap{scale:1.05}
.pop-heart{position:fixed;z-index:30;width:var(--sz,20px);margin:-10px 0 0 -10px;pointer-events:none;animation:pop 1.2s ease-out both}
.pop-heart svg{display:block;width:100%;height:auto;fill:#ff4d66}
@keyframes pop{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.2)}}

/* sound button */
.sound{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));z-index:20;display:grid;place-items:center;width:46px;height:46px;padding:0;border-radius:50%;border:1.5px solid var(--blush);background:rgba(23,4,10,.6);color:var(--blush);cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);-webkit-tap-highlight-color:transparent}
.sound svg{width:22px;height:22px}
.sound .slash{display:none}
.sound.off .waves{display:none}
.sound.off .slash{display:block}
.sound:focus-visible{outline:3px solid var(--blush);outline-offset:3px}

@media (min-width:860px){
  #gallery{max-width:980px}
  .cards{display:grid;grid-template-columns:repeat(2,minmax(0,420px));justify-content:center;align-items:start;gap:3rem 3.5rem}
}
@media (prefers-reduced-motion:reduce){
  .env-wrap,.floater,.floater svg,.card.live .ph img,.card.live .ph::after,.pop-heart{animation:none}
  .card{animation:none}
  .intro,.mini,.flap{transition-duration:.01s;transition-delay:0s}
}
</style>
</head>
<body>

<canvas id="roses" aria-hidden="true"></canvas>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <clipPath id="heartClip"><path d="M50 90 C18 66 3 48 3 30 C3 15 14 5 28 5 C38 5 46 10 50 19 C54 10 62 5 72 5 C86 5 97 15 97 30 C97 48 82 66 50 90 Z"/></clipPath>
    <linearGradient id="phGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color:var(--rose)"/>
      <stop offset="1" style="stop-color:var(--rose-deep)"/>
    </linearGradient>
    <radialGradient id="sealGrad" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#e8304a"/>
      <stop offset="1" stop-color="#7d0618"/>
    </radialGradient>
    <symbol id="heartIcon" viewBox="0 0 100 95"><path d="M50 90 C18 66 3 48 3 30 C3 15 14 5 28 5 C38 5 46 10 50 19 C54 10 62 5 72 5 C86 5 97 15 97 30 C97 48 82 66 50 90 Z"/></symbol>
  </defs>
</svg>

<div class="floaters" id="floaters" aria-hidden="true"></div>

<button class="sound" id="sound" type="button" aria-label="Pause the song" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
    <path class="waves" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>
    <path class="slash" d="M17 9l5 6M22 9l-5 6"/>
  </svg>
</button>

<section class="intro" id="intro">
  <div class="env-wrap" id="envWrap">
    <button class="envelope" id="env" type="button" aria-label="Open the letter: open it my heart">
      <span class="env-back"></span>
      <span id="minis"></span>
      <svg class="env-front" viewBox="0 0 300 200" preserveAspectRatio="none" aria-hidden="true">
        <polygon points="0,0 150,105 0,200" fill="#a60d24"/>
        <polygon points="300,0 150,105 300,200" fill="#9a0b21"/>
        <polygon points="0,200 150,100 300,200" fill="#c01530"/>
        <path d="M0 0 L150 105 L300 0 M0 200 L150 100 L300 200" stroke="rgba(255,190,198,.22)" stroke-width="1" fill="none"/>
      </svg>
      <span class="flap"></span>
      <span class="env-text">open it my heart</span>
      <span class="seal">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="48" fill="url(#sealGrad)"/>
          <circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,200,206,.35)" stroke-width="2"/>
          <path transform="translate(24 25) scale(.52)" fill="#ffe3e6" d="M50 90 C18 66 3 48 3 30 C3 15 14 5 28 5 C38 5 46 10 50 19 C54 10 62 5 72 5 C86 5 97 15 97 30 C97 48 82 66 50 90 Z"/>
        </svg>
      </span>
    </button>
  </div>
</section>

<main id="gallery" hidden>
  <header class="hero">
    <p class="eyebrow">Maligayang Kaarawan</p>
    <h1><span class="hb">Happy Birthday,</span><span class="nm">Heart</span></h1>
    <p class="lede">I gathered a few memories for you today.</p>
  </header>
  <div class="cards" id="cards"></div>
  <footer class="end">
    <p>Happy birthday, my Heart.</p>
    <button class="more" id="more" type="button">Rain more roses</button>
  </footer>
</main>

<script>
/* Edit this list: src is the photo file and caption is the line under it. */
const M="media/";
const ITEMS=[
  {src:M+"photo7.jpg",caption:"That little peace sign gets me every time."},
  {src:M+"photo3.jpg",caption:"My angel, halo and all."},
  {src:M+"frame4.jpg",caption:"Pink top, star clip, perfect day."},
  {src:M+"photo4.jpg",caption:"Even on a busy street, you shine."},
  {src:M+"frame2.jpg",caption:"Bear filter, bigger smile."},
  {src:M+"photo1.jpg",caption:"Mustache day. Still my favorite."},
  {src:M+"frame1.jpg",caption:"I would pick this moment again and again."},
  {src:M+"photo9.jpg",caption:"Hiding behind a bunny, and I still know it is you."},
  {src:M+"frame3.jpg",caption:"The funniest beard on the prettiest face."},
  {src:M+"photo8.jpg",caption:"Posing like you own the night, because you do."},
  {src:M+"frame11.jpg",caption:"You and the cat. Two little cuties."},
  {src:M+"new1.jpg",caption:"Bun up, hair falling, still perfect."},
  {src:M+"frame6.jpg",caption:"Cap on, mood on."},
  {src:M+"photo2.jpg",caption:"Silly face mode, and I love it."},
  {src:M+"new3.jpg",caption:"Close up, and every detail is lovely."},
  {src:M+"frame7.jpg",caption:"Soft eyes that say everything."},
  {src:M+"new5.jpg",caption:"Retro camera, timeless you."},
  {src:M+"frame5.jpg",caption:"Quiet and pretty, just like you."},
  {src:M+"photo5.jpg",caption:"Glasses on, and I am done for."},
  {src:M+"new4.jpg",caption:"Moody lights suit you."},
  {src:M+"frame8.jpg",caption:"Just you being you, and that is plenty."},
  {src:M+"new6.jpg",caption:"Blue glow, soft smile."},
  {src:M+"photo6.jpg",caption:"A quiet moment, kept safe."},
  {src:M+"frame9.jpg",caption:"A song, a mood, a memory."},
  {src:M+"new2.jpg",caption:"A little mystery looks good on you."},
  {src:M+"frame10.jpg",caption:"Relaxed and lovely, just how I remember you."},
  {src:M+"new7.jpg",caption:"Every picture is a reason to smile today."}
];
const MINI=[M+"photo4.jpg",M+"photo3.jpg",M+"photo7.jpg"];
const FLOAT=[M+"photo7.jpg",M+"photo4.jpg",M+"photo3.jpg"];

const HEART="M50 90 C18 66 3 48 3 30 C3 15 14 5 28 5 C38 5 46 10 50 19 C54 10 62 5 72 5 C86 5 97 15 97 30 C97 48 82 66 50 90 Z";
const NS="http://www.w3.org/2000/svg";

function photoBox(src){
  const d=document.createElement("div");
  if(src){
    d.className="ph";
    const im=document.createElement("img");
    im.src=src;im.alt="";
    d.appendChild(im);
  }else{
    d.className="ph empty";
    const s=document.createElementNS(NS,"svg");
    s.setAttribute("viewBox","0 0 100 95");
    s.setAttribute("aria-hidden","true");
    const u=document.createElementNS(NS,"use");
    u.setAttribute("href","#heartIcon");
    s.appendChild(u);
    d.appendChild(s);
  }
  return d;
}

function heartFrame(src){
  const s=document.createElementNS(NS,"svg");
  s.setAttribute("viewBox","0 0 100 95");
  if(src){
    const im=document.createElementNS(NS,"image");
    im.setAttribute("href",src);
    im.setAttribute("x","0");im.setAttribute("y","0");
    im.setAttribute("width","100");im.setAttribute("height","95");
    im.setAttribute("preserveAspectRatio","xMidYMin slice");
    im.setAttribute("clip-path","url(#heartClip)");
    s.appendChild(im);
  }else{
    const f=document.createElementNS(NS,"path");
    f.setAttribute("d",HEART);
    f.setAttribute("class","ph-fill");
    s.appendChild(f);
  }
  const r=document.createElementNS(NS,"path");
  r.setAttribute("d",HEART);
  r.setAttribute("class","ring");
  s.appendChild(r);
  return s;
}

/* build the envelope photos, the cards and the drifting hearts */
(function build(){
  const minis=document.getElementById("minis");
  MINI.forEach(src=>{
    const m=document.createElement("span");
    m.className="mini";
    m.appendChild(photoBox(src));
    minis.appendChild(m);
  });
  const cards=document.getElementById("cards");
  ITEMS.forEach((it,i)=>{
    const c=document.createElement("figure");
    c.className="card";
    c.style.setProperty("--i",i);
    c.style.margin="0";
    c.appendChild(photoBox(it.src));
    const cap=document.createElement("p");
    cap.textContent=it.caption;
    c.appendChild(cap);
    cards.appendChild(c);
  });
  const fl=document.getElementById("floaters");
  ["f1","f2","f3"].forEach((cls,i)=>{
    const f=document.createElement("div");
    f.className="floater "+cls;
    f.appendChild(heartFrame(FLOAT[i]));
    fl.appendChild(f);
  });
})();

/* red rose garden */
const cv=document.getElementById("roses");
const ctx=cv.getContext("2d");
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
let W=0,H=0,dpr=1;

function makeRose(S,p,seed){
  const c=document.createElement("canvas");c.width=c.height=S;
  const g=c.getContext("2d");
  const R=S/2;g.translate(R,R);
  const layers=[
    {n:7,rad:.50,pr:.46,pw:.40},
    {n:6,rad:.40,pr:.38,pw:.33},
    {n:5,rad:.30,pr:.30,pw:.26},
    {n:4,rad:.20,pr:.22,pw:.20}
  ];
  layers.forEach((L,li)=>{
    for(let i=0;i<L.n;i++){
      const a=(i/L.n)*Math.PI*2+li*0.7+seed;
      g.save();g.rotate(a);
      const cy=-R*L.rad;
      const gr=g.createRadialGradient(0,cy-R*.05,R*.02,0,cy,R*L.pr);
      gr.addColorStop(0,li%2?p[0]:p[1]);
      gr.addColorStop(.7,p[1]);
      gr.addColorStop(1,p[2]);
      g.fillStyle=gr;
      g.beginPath();g.ellipse(0,cy,R*L.pw,R*L.pr,0,0,Math.PI*2);g.fill();
      g.lineWidth=S*.008;g.strokeStyle="rgba(40,0,8,.55)";g.stroke();
      g.beginPath();g.ellipse(0,cy-R*.06,R*L.pw*.85,R*L.pr*.8,0,Math.PI*1.1,Math.PI*1.9);
      g.strokeStyle="rgba(255,170,180,.28)";g.lineWidth=S*.01;g.stroke();
      g.restore();
    }
  });
  g.beginPath();
  for(let t=0;t<9;t+=.12){
    const rr=R*.015+t*R*.016;
    g.lineTo(Math.cos(t*1.3+seed)*rr,Math.sin(t*1.3+seed)*rr);
  }
  g.strokeStyle="rgba(35,0,6,.75)";g.lineWidth=S*.012;g.stroke();
  return c;
}
function makePetal(S,p){
  const c=document.createElement("canvas");c.width=c.height=S;
  const g=c.getContext("2d");
  const R=S/2;g.translate(R,R);
  const gr=g.createLinearGradient(0,-R,0,R);
  gr.addColorStop(0,p[0]);gr.addColorStop(1,p[2]);
  g.fillStyle=gr;
  g.beginPath();
  g.moveTo(0,-R*.9);
  g.bezierCurveTo(R*.95,-R*.4,R*.6,R*.7,0,R*.9);
  g.bezierCurveTo(-R*.6,R*.7,-R*.95,-R*.4,0,-R*.9);
  g.fill();
  return c;
}
const PAL=[
  ["#ff3b57","#c4122c","#7a0716"],
  ["#e8203f","#b00e27","#6b0613"],
  ["#ff5068","#d1122f","#8a0a1d"],
  ["#cf1230","#9c0b20","#5e0510"]
];
const roses=PAL.map((p,i)=>makeRose(220,p,i*1.9));
const petals=PAL.map(p=>makePetal(64,p));
const pick=a=>a[Math.floor(Math.random()*a.length)];

let parts=[];
function make(init){
  const petal=Math.random()<.28;
  const size=petal?14+Math.random()*16:30+Math.pow(Math.random(),1.5)*78;
  const depth=size/108;
  return{
    petal,burst:false,dead:false,
    sprite:petal?pick(petals):pick(roses),
    size,
    x:Math.random()*W,
    y:init?Math.random()*H:-size,
    vy:(18+depth*55)*(petal?1.15:1),
    vx:0,ey:0,
    swayA:8+Math.random()*26,
    swayS:.4+Math.random()*.8,
    ph:Math.random()*6.28,
    rot:Math.random()*6.28,
    vr:(Math.random()-.5)*.6,
    alpha:.55+depth*.45
  };
}
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.imageSmoothingQuality="high";
  if(!parts.length){
    const n=Math.max(36,Math.min(90,Math.round(W/7)));
    for(let i=0;i<n;i++)parts.push(make(true));
    parts.sort((a,b)=>a.size-b.size);
  }
  if(still)draw();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  for(const p of parts){
    ctx.globalAlpha=p.alpha;
    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(p.rot);
    ctx.drawImage(p.sprite,-p.size/2,-p.size/2,p.size,p.size);
    ctx.restore();
  }
  ctx.globalAlpha=1;
}
let last=0;
function frame(t){
  const dt=Math.min((t-last)/1000||.016,.05);last=t;
  let anyDead=false;
  for(const p of parts){
    p.ph+=p.swayS*dt;
    const k=Math.pow(.2,dt);
    p.vx*=k;p.ey*=k;
    p.x+=(p.vx+Math.cos(p.ph)*p.swayA)*dt;
    p.y+=(p.vy+p.ey)*dt;
    p.rot+=p.vr*dt;
    if(p.y>H+p.size){
      if(p.burst){p.dead=true;anyDead=true}
      else{p.y=-p.size;p.x=Math.random()*W;p.vx=0;p.ey=0}
    }
  }
  if(anyDead)parts=parts.filter(p=>!p.dead);
  draw();
  requestAnimationFrame(frame);
}
function burst(n,ox,oy){
  if(still)return;
  for(let i=0;i<n;i++){
    const p=make(false);
    p.burst=true;p.x=ox;p.y=oy;
    const a=Math.random()*Math.PI*2,s=250+Math.random()*650;
    p.vx=Math.cos(a)*s;
    p.ey=Math.sin(a)*s-200;
    parts.push(p);
  }
  parts.sort((a,b)=>a.size-b.size);
}
window.addEventListener("resize",resize);
resize();
if(!still)requestAnimationFrame(frame);

/* song: starts from the envelope tap, loops, has a mute button */
const song=new Audio(M+"song.mp3");
song.loop=true;
song.preload="auto";
const soundBtn=document.getElementById("sound");
function setSoundUI(){
  soundBtn.classList.toggle("off",song.paused);
  soundBtn.setAttribute("aria-label",song.paused?"Play the song":"Pause the song");
}
function startSong(){
  song.volume=0;
  const p=song.play();
  if(p&&p.catch)p.catch(()=>{});
  let v=0;
  const t=setInterval(()=>{
    v=Math.min(.85,v+.05);
    try{song.volume=v}catch(e){}
    if(v>=.85)clearInterval(t);
  },150);
  soundBtn.hidden=false;
  setSoundUI();
}
song.addEventListener("play",setSoundUI);
song.addEventListener("pause",setSoundUI);
soundBtn.addEventListener("click",()=>{
  if(song.paused){const p=song.play();if(p&&p.catch)p.catch(()=>{})}
  else song.pause();
});

/* photo motion: cards on screen get .live; tapping a card sends up hearts */
function hearts(x,y){
  if(still)return;
  for(let i=0;i<7;i++){
    const h=document.createElement("span");
    h.className="pop-heart";
    h.style.left=x+"px";h.style.top=y+"px";
    h.style.setProperty("--dx",(Math.random()*120-60)+"px");
    h.style.setProperty("--dy",(-90-Math.random()*110)+"px");
    h.style.setProperty("--sz",(14+Math.random()*16)+"px");
    h.style.animationDelay=(i*40)+"ms";
    h.innerHTML='<svg viewBox="0 0 100 95" aria-hidden="true"><use href="#heartIcon"/></svg>';
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),1500);
  }
}
const io="IntersectionObserver" in window?new IntersectionObserver(es=>{
  es.forEach(e=>e.target.classList.toggle("live",e.isIntersecting));
},{rootMargin:"80px"}):null;
document.querySelectorAll(".card").forEach((c,i)=>{
  const sg=()=>(Math.random()<.5?-1:1)*(1+Math.random()*2)+"%";
  c.style.setProperty("--s",i%2?-1:1);
  c.style.setProperty("--ox",(25+Math.random()*50)+"%");
  c.style.setProperty("--oy",(20+Math.random()*40)+"%");
  c.style.setProperty("--tx",sg());
  c.style.setProperty("--ty",sg());
  if(io)io.observe(c);else c.classList.add("live");
  c.addEventListener("click",ev=>{
    hearts(ev.clientX,ev.clientY);
    c.classList.add("tap");
    setTimeout(()=>c.classList.remove("tap"),260);
  });
});

/* open the letter */
const env=document.getElementById("env");
const intro=document.getElementById("intro");
const gallery=document.getElementById("gallery");
env.addEventListener("click",()=>{
  if(env.classList.contains("open"))return;
  startSong();
  env.classList.add("open");
  document.getElementById("envWrap").classList.add("stop");
  document.body.classList.add("opened");
  const r=env.getBoundingClientRect();
  burst(70,r.left+r.width/2,r.top+r.height*.4);
  setTimeout(()=>intro.classList.add("leaving"),2400);
  setTimeout(()=>{
    intro.hidden=true;
    gallery.hidden=false;
    window.scrollTo(0,0);
  },3100);
});
document.getElementById("more").addEventListener("click",()=>{
  burst(60,window.innerWidth/2,window.innerHeight*.35);
});
